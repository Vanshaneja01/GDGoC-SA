<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <!-- GDG on Campus IIMT Meerut Official Vector Lockup -->
  <g transform="translate(10, 10)">
    <!-- Container -->
    <rect x="2" y="2" width="56" height="56" rx="14" fill="#0f172a" stroke="#4285F4" stroke-width="2"/>
    <!-- Google Developer Brackets < / > -->
    <!-- Left Bracket < -->
    <path d="M22 20 L13 29 L22 38" stroke="#4285F4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <line x1="33" y1="18" x2="27" y2="40" stroke="#EA4335" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right Bracket > -->
    <path d="M38 20 L47 29 L38 38" stroke="#34A853" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center Dot -->
    <circle cx="30" cy="29" r="2.2" fill="#FBBC04"/>
  </g>
  <!-- Typography Lockup -->
  <g transform="translate(80, 18)">
    <text x="0" y="21" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="-0.3">Google Developer Groups</text>
    <text x="0" y="37" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">ON CAMPUS &bull; IIMT MEERUT</text>
    <text x="0" y="50" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.4">Powered by IIMTBIF &bull; Student Community</text>
  </g>
</svg>
