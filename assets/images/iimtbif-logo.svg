<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- IIMTBIF Official Vector Logo Lockup -->
  <g transform="translate(10, 10)">
    <!-- Incubator Shield / Hexagon Emblem -->
    <rect x="2" y="2" width="56" height="56" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Outer Gear Nodes -->
    <circle cx="30" cy="12" r="3" fill="#38bdf8"/>
    <circle cx="48" cy="30" r="3" fill="#f59e0b"/>
    <circle cx="30" cy="48" r="3" fill="#34d399"/>
    <circle cx="12" cy="30" r="3" fill="#818cf8"/>
    <!-- Connecting Circuit Lines -->
    <path d="M30 15 L30 24 M45 30 L36 30 M30 45 L30 36 M15 30 L24 30" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Innovation Rocket / Sprout Center -->
    <path d="M30 20 C27 25 24 30 24 35 C24 38.3 26.7 41 30 41 C33.3 41 36 38.3 36 35 C36 30 33 25 30 20 Z" fill="#38bdf8"/>
    <circle cx="30" cy="32" r="3" fill="#ffffff"/>
    <path d="M26 36 L21 41 M34 36 L39 41" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text Lockup -->
  <g transform="translate(80, 18)">
    <text x="0" y="22" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="-0.5">IIMT<tspan fill="#38bdf8">BIF</tspan></text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#cbd5e1" letter-spacing="0.4">BUSINESS INCUBATOR FOUNDATION</text>
    <text x="0" y="50" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.3">Supported by DST, Govt. of India &amp; UP</text>
  </g>
</svg>
