<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- IIMT University Meerut Official Vector Logo Lockup -->
  <g transform="translate(10, 10)">
    <!-- Academic Shield / Crest Container -->
    <rect x="2" y="2" width="56" height="56" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <!-- Rising Sun of Knowledge -->
    <path d="M22 28 C24 22 36 22 38 28 Z" fill="#f59e0b"/>
    <circle cx="30" cy="27" r="4" fill="#ffffff"/>
    <!-- Sun rays -->
    <line x1="30" y1="18" x2="30" y2="21" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="22" y1="21" x2="24" y2="23" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="38" y1="21" x2="36" y2="23" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Open Book of Learning -->
    <path d="M19 33 C25 31 30 34 30 34 C30 34 35 31 41 33 L41 43 C35 41 30 44 30 44 C30 44 25 41 19 43 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="30" y1="34" x2="30" y2="44" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Laurel Leaves -->
    <path d="M15 45 C15 37 18 32 18 32" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M45 45 C45 37 42 32 42 32" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Typography Lockup -->
  <g transform="translate(80, 18)">
    <text x="0" y="22" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="21" font-weight="900" fill="#ffffff" letter-spacing="-0.3">IIMT <tspan fill="#f59e0b">UNIVERSITY</tspan></text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" letter-spacing="1">MEERUT &bull; UTTAR PRADESH</text>
    <text x="0" y="50" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="0.5">NAAC Accredited &bull; Transforming Education</text>
  </g>
</svg>
