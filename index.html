<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDGconnect — Mentor & Ambassador Management Portal</title>
  
  <!-- Google Web Fonts: Product Sans, Roboto & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>

  <!-- Google Signature 4-Color Accent Stripe -->
  <div class="google-top-stripe"></div>

  <div id="app">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Collapsible Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <a href="#dashboard" class="app-brand" id="brand-link">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M8 7L3 12L8 17" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 7L21 12L16 17" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13.5 5L10.5 19" stroke="#34A853" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="12" cy="12" r="1.5" fill="#FBBC04"/>
            </svg>
          </div>
          <div>
            GDGconnect
            <span class="brand-badge">Google Theme</span>
          </div>
        </a>
      </div>

      <!-- Live Role & Persona Card -->
      <div class="sidebar-role-card">
        <div class="role-card-header">
          <span class="role-pill role-pill-mentor" id="sidebar-role-indicator">Mentor Mode</span>
          <span style="font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-family-mono);">v2.4</span>
        </div>
        <div class="role-user-brief">
          <div id="sidebar-user-avatar"></div>
          <div class="role-user-meta">
            <span class="role-user-name" id="sidebar-user-name">Dr. Evelyn Vance</span>
            <span class="role-user-id" id="sidebar-user-id">MTR-101</span>
          </div>
        </div>
      </div>

      <!-- Main Navigation Items (Strictly Ordered 1-13) -->
      <nav class="sidebar-nav" id="sidebar-nav-list" aria-label="Main Navigation">
        <!-- Injected dynamically by app.js -->
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--text-muted);">
          <span style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--status-green); display: inline-block;"></span>
          <span>Online • Local DB</span>
        </div>
      </div>
    </aside>

    <!-- Main Viewport Layout -->
    <div class="app-viewport">
      
      <!-- Top Navigation Bar -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="btn-icon" id="mobile-menu-btn" aria-label="Toggle Navigation Menu">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <!-- Global Search with keyboard shortcut -->
          <div class="global-search-container">
            <svg class="global-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="global-search-input" id="global-search-input" placeholder="Search mentors, tasks, labs..." aria-label="Global Search">
            <kbd class="global-search-shortcut">/</kbd>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Role Quick Switch Bar -->
          <div class="role-quick-switch" title="Toggle active role perspective">
            <button class="role-switch-btn active" id="role-btn-mentor">
              Mentor
            </button>
            <button class="role-switch-btn" id="role-btn-ambassador">
              Ambassador
            </button>
          </div>

          <!-- Notification Bell with Counter -->
          <button type="button" class="topbar-icon-btn" id="notifications-btn" aria-label="View notifications">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
            </svg>
            <span class="badge-counter" id="notification-badge" style="display: none;">0</span>
          </button>

          <!-- Theme Mode Switcher -->
          <button type="button" class="topbar-icon-btn" id="theme-toggle-btn" aria-label="Toggle Dark / Light Theme" title="Toggle Theme">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- User Profile Menu Trigger -->
          <div class="user-menu-trigger" id="user-menu-trigger" title="Click to view Settings & Identity Switcher">
            <div id="topbar-user-avatar"></div>
            <div class="user-menu-info">
              <span class="user-menu-name" id="topbar-user-name">Dr. Evelyn Vance</span>
              <span class="user-menu-role" id="topbar-user-role">Mentor • MTR-101</span>
            </div>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); margin-left: 2px;">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
      </header>

      <!-- Main Content Viewport (Dynamic Section Renderer) -->
      <main class="app-main" id="main-content-viewport" role="main">
        <!-- Content will be rendered dynamically -->
      </main>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Accessible Modal Host -->
  <div id="modal-host"></div>

  <!-- Application Logic & Section Modules -->
  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sections/dashboard.js"></script>
  <script src="js/sections/mentors.js"></script>
  <script src="js/sections/ambassadors.js"></script>
  <script src="js/sections/tasks.js"></script>
  <script src="js/sections/mentor-sessions.js"></script>
  <script src="js/sections/ambassador-sessions.js"></script>
  <script src="js/sections/labs-registrations.js"></script>
  <script src="js/sections/reports.js"></script>
  <script src="js/sections/announcements.js"></script>
  <script src="js/sections/resources.js"></script>
  <script src="js/sections/communication.js"></script>
  <script src="js/sections/achievements.js"></script>
  <script src="js/sections/calendar.js"></script>
  <script src="js/sections/profile-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
